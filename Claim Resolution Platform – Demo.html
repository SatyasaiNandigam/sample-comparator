<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claim Resolution Platform – Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#152033;--mute:#5d6b80;--line:#d9dfe7;--side:#152033;--ok:#0d7a6f;--okbg:#dcf2ee;--warn:#9a6400;--warnbg:#fbeccb;--bad:#a8323f;--badbg:#f7dde0;--acc:#2f5fd0;--accbg:#e1e9fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--panel:#172133;--ink:#e6ecf5;--mute:#93a1b8;--line:#2b394f;--side:#0a101b;--ok:#4fd1c0;--okbg:#12342f;--warn:#f0b84b;--warnbg:#3b2d0f;--bad:#f08b96;--badbg:#401a21;--acc:#8aa9f5;--accbg:#1c2b4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1522;--panel:#172133;--ink:#e6ecf5;--mute:#93a1b8;--line:#2b394f;--side:#0a101b;--ok:#4fd1c0;--okbg:#12342f;--warn:#f0b84b;--warnbg:#3b2d0f;--bad:#f08b96;--badbg:#401a21;--acc:#8aa9f5;--accbg:#1c2b4d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}h2{font-size:24px}h3{font-size:18px;margin-bottom:8px}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--side);color:#c9d3e2;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:600 19px Newsreader,serif;color:#fff;padding:0 6px}.sub{font-size:12px;padding:2px 6px 16px;opacity:.7}
.cl{all:unset;display:block;width:100%;box-sizing:border-box;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.cl:hover{background:#ffffff12}.cl.on{background:#ffffff22}.cl b{color:#fff;font-weight:600}.cl small{display:block;opacity:.75;margin:1px 0 5px}
.newb{all:unset;cursor:pointer;display:block;text-align:center;border:1px dashed #ffffff55;border-radius:8px;padding:9px;margin:10px 0 16px;color:#fff;font-weight:600}.newb:hover{background:#ffffff12}
.cl:focus-visible,.newb:focus-visible,.btn:focus-visible,.nd:focus-visible{outline:2px solid #8aa9f5;outline-offset:2px}
.note{font-size:12px;opacity:.6;border-top:1px solid #ffffff22;margin-top:14px;padding-top:12px}
main{padding:26px clamp(16px,3vw,40px) 60px;max-width:1080px;width:100%}
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:18px}.tag{font-size:13px;color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--accbg);color:var(--acc)}.mute{background:var(--line);color:var(--mute)}
aside .pill{background:#ffffff1f;color:#dfe7f3}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.btn{all:unset;cursor:pointer;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:7px;font-weight:600;font-size:14px}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:hover{opacity:.88}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:14px}
.f{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--bg);overflow-wrap:anywhere}.f.n{border-color:var(--acc);background:var(--accbg)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mute);margin-bottom:14px}
.menu{margin-top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pipe{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.nd{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:center;background:var(--bg)}
.nd.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}.nd.off{cursor:default}.nd.reuse{opacity:.55}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.run .dot{background:var(--acc);animation:p 1s infinite}.ran .dot{background:var(--ok)}.reuse .dot{background:var(--mute)}
@keyframes p{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.run .dot{animation:none}}
.ins{border-top:1px solid var(--line);padding-top:12px}.ins ul{margin:8px 0 0;padding-left:20px}.ins li{margin-bottom:4px}
.hero h1{font-size:clamp(24px,3.4vw,34px);line-height:1.2;margin:2px 0 8px}.hero p{margin:0 0 6px;color:var(--mute);max-width:68ch}
table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:6px 10px 6px 0}td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}.scroll{overflow-x:auto}
.draft{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.log{padding:0;margin:0;list-style:none}.log li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.log time{color:var(--mute);font-size:12px;margin-right:8px}
.wh{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.wh div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--bg)}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.wh{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside><div class="brand">Claim Resolution Platform</div><div class="sub">Adjuster workspace · demo with sample data</div><div id="rail"></div><div class="note">Everything here is mocked. No files are uploaded and nothing is sent.</div></aside><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),pill=(t,c)=>`<span class="pill ${c}">${t}</span>`,cl={o:'ok',w:'warn',b:'bad'};
const AG=[['Intake agent','Classifies the claim and normalises the first notice of loss'],['Policy agent','Reads the contract, endorsements and the version in force on the loss date'],['Evidence agent','Extracts facts from every document, each linked to its source'],['Gap analysis agent','Finds contradictions, missing items and weak proof'],['Coverage reasoning agent','Maps policy wording to facts, and abstains when unsure'],['Settlement agent','Passes values to a fixed calculation engine'],['Action planning agent','Proposes the next best steps'],['Quality & audit agent','Checks citations, consistency and permissions']];
const iss=(a,b,c,d,k)=>[['Policy active on loss date','Established','ok'],['Water damage cover applies','Identified','ok'],['Sudden and accidental condition',a,cl[k[0]]],['Gradual leakage exclusion',b,cl[k[1]]],['Inspection evidence',c,cl[k[2]]],['Final coverage conclusion',d,cl[k[3]]]];
const R1={head:'Not decidable yet. The cause of loss is in conflict.',sub:'The customer reports a sudden pipe burst, but the plumber and surveyor findings suggest a slow leak. The policy covers one and excludes the other.',status:['Awaiting evidence','warn'],settle:'Illustration if coverage is confirmed: ₹3,75,000 (limit applies). Not payable until an adjuster approves.',
issues:iss('Unresolved','Potentially relevant','Incomplete','Requires further investigation','wwww'),
actions:[['Request supplementary plumber report','Customer / plumber','Draft ready','info'],['Validate contractor estimate of ₹4,50,000','Claims team','Task proposed','info'],['Hold coverage decision','Adjuster','Human only','warn']],
draft:'Subject: Additional information needed for CLM-001\n\nDear Mrs. Iyer, please ask your plumber for a supplementary report covering: (1) the likely cause of the joint failure, (2) whether the corrosion existed before 3 October, and (3) whether the damage fits a sudden burst or a long-term leak. This single report is all we need to move forward.',
what:['If the plumber confirms a sudden failure, coverage under Clause 4.2 is reassessed.','If it shows leaking for weeks, Clause 7.3 and E-03 are reassessed.','If it is inconclusive, a specialist inspection is requested.'],
ag:[['Classified as property damage: water','Loss on 3 Oct 2026, reported 4 Oct','Triage: complex, reports conflict'],['Policy was active on the loss date','Clause 4.2 covers sudden discharge','Clause 7.3 excludes gradual leakage, modified by E-03 (14-day rule); E-03 takes precedence'],['6 facts extracted, each with document, page and quote','F-103 corrosion near joint; F-104 moisture in several rooms','Confidence means reading accuracy, not coverage'],['Contradiction: sudden burst vs prolonged leak','Missing: a reliable date the damage began','Weak: repair estimate not validated','Minimum evidence needed: plumber statement on failure mechanism and corrosion timing'],['Sudden-and-accidental condition: unresolved','Gradual leakage exclusion: potentially relevant','Abstains from a conclusion because the ambiguity is genuine'],['Loss ₹4,50,000; 8% depreciation gives ₹4,14,000','Limit ₹4,00,000 applies; deductible ₹25,000','Illustrative ₹3,75,000, computed by a fixed engine, not the AI'],['One targeted request instead of a generic document list','Estimate review proposed','Nothing sent: customer messages wait for approval'],['Every fact traced to document, page and quote','Policy wording cited for each issue','No adverse decision made; approval gate open']]};
const E1=[{l:'Plumber report: sudden failure',f:'Plumber_supplementary_report.pdf',re:[2,3,4,5,6,7],p:{head:'Evidence now supports coverage. Ready for adjuster review.',status:['Ready for review','ok'],issues:iss('Supported – adjuster to confirm','Not indicated','Sufficient','Supports coverage – adjuster decides','oooo'),actions:[['Send progress update to customer','Customer service','Draft ready','info'],['Review coverage and settlement','Adjuster','Human only','warn']],draft:'Subject: Update on CLM-001\n\nDear Mrs. Iyer, thank you for the plumber’s report. Your claim is now with our adjuster for review. We will update you within 3 working days.',what:null,sub:'The supplementary report describes an abrupt joint failure consistent with the night of 3 October.',agp:{2:['New report read: abrupt joint failure, consistent with 3 Oct','Damage onset date now established'],3:['Contradiction resolved in favour of sudden failure','No open gaps on cause of loss'],4:['Condition in Clause 4.2 supported; exclusion 7.3 not indicated','Recommends adjuster review, no automatic approval'],5:['Settlement inputs unchanged; figure ready for adjuster review'],6:['Drafted customer progress update (draft only)'],7:['New report linked to F-107 with page and quote','Claim record v2 saved alongside v1']}}},
{l:'Plumber report: prolonged leakage',f:'Plumber_supplementary_report.pdf',re:[2,3,4,6,7],p:{head:'Evidence points to prolonged leakage. Senior review needed.',status:['Senior review needed','bad'],issues:iss('Not supported','Applies – check exceptions','Sufficient','Possible exclusion – senior review before any adverse decision','bbob'),actions:[['Senior review of Clause 7.3 and E-03 wording','Senior adjuster','Human only','bad'],['Prepare explanation for customer (not sent)','Claims team','Draft only','info']],draft:'Draft for adjuster only. Not for sending.\n\nThe supplementary report indicates leakage over several weeks. Clause 7.3 as modified by E-03 may apply. Recommend senior review of the wording and any exceptions before customer communication.',what:null,settle:'Settlement not calculated while the exclusion is under review.',sub:'The supplementary report indicates leakage over several weeks, which brings the exclusion into question.',agp:{2:['New report read: leak ongoing for several weeks'],3:['Contradiction resolved against the sudden-failure account'],4:['Exclusion 7.3 with E-03 may apply','Exceptions to be checked; no denial recommended by the system'],6:['Escalation to senior adjuster proposed'],7:['Adverse outcome flagged: only an authorised human can decide']}}},
{l:'Plumber report: inconclusive',f:'Plumber_supplementary_report.pdf',re:[2,3,4,6,7],p:{head:'Still unresolved. A specialist inspection is the next step.',status:['Awaiting inspection','warn'],issues:iss('Still unresolved','Still potentially relevant','Still incomplete','Specialist inspection requested','wwww'),actions:[['Schedule specialist inspection','Surveyor team','Task created','info'],['Notify customer of inspection','Customer service','Draft ready','info']],draft:'Subject: Site inspection for CLM-001\n\nDear Mrs. Iyer, the report did not settle the cause of damage. We would like to arrange a specialist inspection. Please suggest two convenient dates.',what:null,sub:'The supplementary report did not settle how or when the damage began.',agp:{2:['New report read: no clear failure mechanism'],3:['Contradiction remains open'],4:['Still abstaining from a conclusion'],6:['Inspection task and customer notice drafted'],7:['Reason for inspection recorded']}}}];
const R2={head:'One check left before adjuster review.',sub:'Fire is an insured peril and the evidence is consistent. The kitchen repair estimate looks high.',status:['Estimate check pending','warn'],settle:'Illustration if approved: ₹6,10,000 after a ₹15,000 deductible.',issues:[['Policy active on loss date','Established','ok'],['Fire is an insured peril (Clause 3.1)','Established','ok'],['Cause of fire','Consistent with electrical fault','ok'],['Exclusions','None triggered','ok'],['Repair estimate','₹60,000 above typical range','warn'],['Final coverage conclusion','Supports coverage – adjuster decides','ok']],actions:[['Ask contractor to revise estimate','Claims team','Draft ready','info'],['Review coverage and settlement','Adjuster','Human only','warn']],draft:'Subject: Clarification on your estimate, CLM-002\n\nDear Mr. Rao, the line items for kitchen cabinetry are higher than our usual range. Please share a revised or itemised estimate.',what:null,
ag:[['Classified as property damage: fire'],['Policy active; Clause 3.1 covers fire'],['5 facts extracted from fire brigade note and photos'],['No contradictions','Estimate cabinetry lines high'],['Cover applies; no exclusion triggered'],['₹6,25,000 less ₹15,000 deductible, calculated by the engine'],['One targeted estimate query drafted'],['All facts cited; approval gate open']]};
const E2=[{l:'Revised contractor estimate',f:'Revised_estimate.pdf',re:[2,3,5,6,7],p:{head:'Ready for adjuster review.',status:['Ready for review','ok'],sub:'The revised estimate is within the expected range.',issues:R2.issues.map(r=>r[0]==='Repair estimate'?['Repair estimate','Within typical range','ok']:r),actions:[['Review coverage and settlement','Adjuster','Human only','warn']],draft:'No customer message needed at this stage.',agp:{2:['Revised estimate read: ₹5,65,000'],3:['Estimate gap closed'],5:['Recalculated: ₹5,50,000 after deductible'],6:['Estimate query closed'],7:['Revision saved as v2']}}}];
const R3={head:'The policy may have lapsed six days before the storm.',sub:'Storm damage is covered, but the renewal premium receipt is missing, so cover on the loss date is unclear.',status:['Awaiting document','warn'],settle:'Not calculated until cover on the loss date is confirmed.',issues:[['Policy active on loss date','Unclear: premium receipt missing','warn'],['Storm damage covered (Clause 2.4)','Identified','ok'],['Roof age condition','Within limits','ok'],['Final coverage conclusion','Requires premium payment proof','warn']],actions:[['Request premium payment receipt','Customer','Draft ready','info'],['Check payment in billing system','Policy admin','Task proposed','info']],draft:'Subject: Document needed for your roof claim\n\nPlease send the premium receipt for your policy renewal. It will confirm your cover on the date of the storm.',what:null,
ag:[['Classified as property damage: storm'],['Policy term ended six days before the loss','Renewal not recorded in the schedule'],['5 facts extracted from inspection report and photos'],['Missing: proof of renewal payment'],['Storm cover applies if the policy was active','Abstains until cover is confirmed'],['Not run: coverage open'],['One precise request drafted'],['Open question logged; no adverse decision made']]};
const E3=[{l:'Premium payment receipt',f:'Premium_receipt.pdf',re:[1,3,4,5,6,7],p:{head:'Cover confirmed. Ready for adjuster review.',status:['Ready for review','ok'],sub:'The receipt shows renewal was paid two days before the policy ended.',issues:[['Policy active on loss date','Established','ok'],['Storm damage covered (Clause 2.4)','Identified','ok'],['Roof age condition','Within limits','ok'],['Final coverage conclusion','Supports coverage – adjuster decides','ok']],actions:[['Review coverage and settlement','Adjuster','Human only','warn']],settle:'Illustration if approved: ₹1,85,000 after deductible.',draft:'No customer message needed at this stage.',agp:{1:['Renewal payment confirmed; policy active'],3:['Gap closed'],4:['Cover applies; no exclusions triggered'],5:['₹2,00,000 less ₹15,000 deductible'],6:['Request closed'],7:['Receipt linked to the policy record']}}}];
const DOCS3=[['FNOL.pdf','First notice of loss'],['Policy_schedule.pdf','Policy'],['Roof_inspection.pdf','Inspection'],['Roof_photos.zip','Photos'],['Contractor_estimate.pdf','Estimate']];
const mk=(id,type,cust,docs,res,ev,ver)=>({id,type,cust,docs,pend:[],res,ev,ver,ns:res?Array(8).fill('ran'):[],log:ver?[['09:12','Documents received and analysed, claim record v1']]:[],appr:null,busy:false});
const C=[mk('CLM-001','Water damage','Mrs. R. Iyer',[['FNOL.pdf','First notice of loss'],['Policy_base.pdf','Policy'],['Endorsement_E-03.pdf','Endorsement'],['Plumber_report.pdf','Technical'],['Surveyor_report.pdf','Technical'],['Damage_photos.zip','Photos'],['Contractor_estimate.pdf','Estimate'],['Invoice_0412.pdf','Invoice']],R1,E1,1),
mk('CLM-002','Kitchen fire','Mr. A. Rao',[['FNOL.pdf','First notice of loss'],['Policy.pdf','Policy'],['Fire_brigade_note.pdf','Technical'],['Photos.zip','Photos'],['Contractor_estimate.pdf','Estimate']],R2,E2,1),
Object.assign(mk('CLM-003','Storm roof damage','Ms. P. Menon',[],null,E3,0),{pend:DOCS3})];
let cur='CLM-001',menu=false,sel={},n=4;
const cc=()=>C.find(c=>c.id===cur),now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const stat=c=>c.res?c.res.status:c.docs.length?['Documents received','info']:['New claim','mute'];
function rail(){return `<button class="newb" data-new>+ New claim</button>`+C.map(c=>`<button class="cl ${c.id===cur?'on':''}" data-c="${c.id}"><b>${c.id}</b> · ${c.type}<small>${c.cust}</small>${pill(...stat(c))}</button>`).join('')}
function main(c){const r=c.res,b=c.busy,s=sel[c.id];
let h=`<div class="hd"><div><h2>${c.id} · ${c.type}</h2><div class="tag">${c.cust} · ${c.ver?'Claim record v'+c.ver:'Not analysed yet'}</div></div>${pill(...stat(c))}</div>`;
h+=`<div class="card"><h3>Claimant documents</h3>${c.docs.length?`<div class="files">${c.docs.map(d=>`<div class="f ${d[2]?'n':''}"><b>${d[0]}</b><br><span class="tag">${d[1]}${d[2]?' · new evidence':''}</span></div>`).join('')}</div>`:`<div class="drop">Drop the claimant’s documents here<br><span class="tag">Policy, endorsements, reports, photos, estimates, invoices</span></div>`}`;
if(!c.docs.length)h+=`<button class="btn" data-up>Attach sample documents</button>`;
else if(!r&&!b)h+=`<button class="btn" data-an>Analyse claim</button>`;
else if(r&&!b)h+=`<button class="btn alt" data-menu>Add evidence to this claim</button>${menu?`<div class="menu">${c.ev.map((e,i)=>!c.docs.some(d=>d[2]&&d[0]===e.f&&c.ev.length===1)?`<button class="btn alt" data-ev="${i}">${e.l}</button>`:'').join('')||'<span class="tag">No more sample evidence to add.</span>'}</div>`:''}`;
h+='</div>';
if(b||r){h+=`<div class="card"><h3>Agent pipeline</h3><div class="tag">${b?'Agents are working on the claim…':'Select an agent to see what it found.'}</div><div class="pipe">${AG.map((a,i)=>`<button class="nd ${c.ns[i]} ${i===s&&!b?'sel':''} ${b?'off':''}" data-ag="${i}"><span class="dot"></span>${a[0].replace(' agent','')}</button>`).join('')}</div>`;
if(!b&&s!==undefined)h+=`<div class="ins"><b>${AG[s][0]}</b> ${pill(c.ns[s]==='reuse'?'Reused from v'+(c.ver-1):'Ran in v'+c.ver,c.ns[s]==='reuse'?'mute':'info')}<div class="tag">${AG[s][1]}</div><ul>${r.ag[s].map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
h+='</div>'}
if(r&&!b){h+=`<div class="card hero"><div class="tag">Where this claim stands</div><h1>${r.head}</h1><p>${r.sub}</p><p><b>${r.settle}</b></p></div>
<div class="card"><h3>Recommended actions</h3><div class="scroll"><table><tr><th>Next step</th><th>Who</th><th>How it runs</th></tr>${r.actions.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${pill(a[2],a[3])}</td></tr>`).join('')}</table></div><h3 style="margin-top:16px">Draft message</h3><div class="draft">${r.draft}</div>${c.appr?pill(c.appr,'ok'):`<button class="btn" data-ap>Approve next steps</button> <span class="tag">Nothing is sent until an adjuster approves.</span>`}</div>
<div class="card"><h3>Coverage issues</h3><div class="scroll"><table><tr><th>Issue</th><th>Current assessment</th></tr>${r.issues.map(i=>`<tr><td>${i[0]}</td><td>${pill(i[1],i[2])}</td></tr>`).join('')}</table></div></div>`;
if(r.what)h+=`<div class="card"><h3>What would resolve this claim?</h3><div class="wh">${r.what.map(w=>`<div>${w}</div>`).join('')}</div></div>`;
h+=`<div class="card"><h3>Audit trail</h3><ul class="log">${c.log.map(l=>`<li><time>${l[0]}</time>${l[1]}</li>`).join('')}</ul></div>`}
return h}
function draw(){$('#rail').innerHTML=rail();$('#main').innerHTML=main(cc())}
function runP(c,list,done){c.busy=true;c.ns=AG.map((a,i)=>list.includes(i)?'':'reuse');let k=0;const st=()=>{if(k>0)c.ns[list[k-1]]='ran';if(k<list.length){c.ns[list[k]]='run';k++;draw();setTimeout(st,420)}else{c.busy=false;done();draw()}};st()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-c],[data-new],[data-up],[data-an],[data-menu],[data-ev],[data-ag],[data-ap]');if(!t)return;const c=cc(),d=t.dataset;
if(d.c){cur=d.c;menu=false}
else if('new' in d){const id='CLM-00'+n++;C.unshift(Object.assign(mk(id,'Storm roof damage','New claimant',[],null,E3,0),{pend:DOCS3}));cur=id}
else if('up' in d){const q=c.pend.slice();let k=0;const f=()=>{if(k<q.length){c.docs.push(q[k++]);draw();setTimeout(f,300)}else{c.log.unshift([now(),q.length+' documents attached']);draw()}};f();return}
else if('an' in d){c.res=R3;c.ver=1;c.log.unshift([now(),'Analysis complete, claim record v1']);const r=c.res;c.res=null;runP(c,[0,1,2,3,4,5,6,7],()=>{c.res=r});return}
else if('menu' in d){menu=!menu}
else if(d.ev!==undefined){const e=c.ev[+d.ev];menu=false;c.docs.push([e.f,'Supplementary evidence',1]);c.ver++;c.appr=null;c.log.unshift([now(),`${e.f} added: ${e.re.length} agents re-run, ${8-e.re.length} reused, claim record v${c.ver}`]);const old=c.res;runP(c,e.re,()=>{c.res={...old,...e.p,ag:old.ag.map((a,i)=>(e.p.agp&&e.p.agp[i])||a)}});return}
else if(d.ag!==undefined){if(!c.busy)sel[c.id]=+d.ag}
else if('ap' in d){c.appr='Approved by adjuster';c.log.unshift([now(),'Adjuster approved the recommended next steps'])}
draw()});
draw();
</script>
</body>
</html>
